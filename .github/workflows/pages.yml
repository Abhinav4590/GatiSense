name: Deploy GatiSense to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract GatiSense project
        run: |
          unzip -o GatiSense_Vercel_Modern_India_Labels_Final.zip -d extracted

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: './extracted/GatiSense'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
